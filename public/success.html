<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Appointment Confirmed</title>
    <link rel="stylesheet" href="output.css" />
  </head>

  <body
    class="bg-slate-100 flex items-center justify-center min-h-screen font-sans"
  >
    <!-- Card -->
    <div class="bg-white shadow-xl rounded-xl p-10 text-center max-w-md w-full">
      <!-- Success Icon -->
      <div class="flex justify-center mb-4">
        <div class="bg-green-100 p-4 rounded-full">
          <svg
            class="w-12 h-12 text-green-600"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M5 13l4 4L19 7"
            />
          </svg>
        </div>
      </div>

      <!-- Heading -->
      <h1 class="text-2xl font-bold text-slate-800 mb-2">
        Appointment Booked Successfully
      </h1>

      <!-- Tagline -->
      <p class="text-slate-600 mb-6">
        Thank you for trusting our healthcare services. Your appointment has
        been confirmed.
      </p>

      <!-- Healthcare Tagline -->
      <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-6">
        <p class="text-green-700 font-semibold">Your Health, Our Priority</p>
        <p class="text-green-600 text-sm">
          Providing trusted, professional, and compassionate healthcare.
        </p>
      </div>

      <!-- Button -->
      <a
        href="index.html"
        class="bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded-lg font-medium transition duration-300"
      >
        Back to Home
      </a>
    </div>
  </body>
</html>
